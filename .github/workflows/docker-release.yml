name: Docker Release

on:
  push:
    tags:
      - '*'

jobs:
  docker:
    name: Build and push Docker image to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          set -euxo pipefail

          REPO_LOWER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="ghcr.io/${REPO_LOWER}/proposition7-benchmark-artifact:${{ github.ref_name }}"
          IMAGE_LATEST="ghcr.io/${REPO_LOWER}/proposition7-benchmark-artifact:latest"

          echo "Building image: ${IMAGE_TAG}"
          make docker IMAGE_NAME="${IMAGE_TAG}"

          echo "Loading image from tar..."
          docker load -i dist/proposition7-benchmark-artifact.tar

          echo "Ensuring loaded image is tagged correctly..."
          if ! docker image inspect "${IMAGE_TAG}" >/dev/null 2>&1; then
            LOADED_IMAGE="$(docker images --format '{{.Repository}}:{{.Tag}}' | head -n 1)"
            docker tag "${LOADED_IMAGE}" "${IMAGE_TAG}"
          fi

          echo "Pushing to GHCR..."
          docker push "${IMAGE_TAG}"

          echo "Tagging as latest..."
          docker tag "${IMAGE_TAG}" "${IMAGE_LATEST}"
          docker push "${IMAGE_LATEST}"

          echo "Verifying push..."
          docker manifest inspect "${IMAGE_TAG}"

          echo "Done!"

      - name: Create source bundle, manifest and checksums
        run: |
          set -euxo pipefail

          REPO_LOWER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="ghcr.io/${REPO_LOWER}/proposition7-benchmark-artifact:${{ github.ref_name }}"

          test -f dist/proposition7-review-bundle.tar.gz
          test -f dist/proposition7-review-manifest.txt

          mv dist/proposition7-review-bundle.tar.gz dist/sas26_reproduction.source.tar.gz

          sed -i "s|image_name=.*|image_name=${IMAGE_TAG}|" dist/proposition7-review-manifest.txt
          mv dist/proposition7-review-manifest.txt dist/sas26_reproduction.manifest.txt

          sha256sum \
            dist/sas26_reproduction.source.tar.gz \
            dist/sas26_reproduction.manifest.txt \
            > dist/sas26_reproduction.checksums.txt 
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }} (Paper Reproduction)
          body_path: dist/release_body.md
          files: |
            dist/sas26_reproduction.source.tar.gz
            dist/sas26_reproduction.manifest.txt
            dist/sas26_reproduction.checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}