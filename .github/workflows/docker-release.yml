name: Docker Release

on:
  push:
    tags:
      - '*'

jobs:
  docker:
    name: Build and push Docker image to GHCR
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          REPO_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${REPO_LOWER}/sas26-reproduction:${{ github.ref_name }}"
          make docker IMAGE_NAME="$IMAGE_TAG"
          docker load -i dist/proposition7-benchmark-artifact.tar
          docker push "$IMAGE_TAG"
          docker tag "$IMAGE_TAG" "ghcr.io/${REPO_LOWER}/sas26-reproduction:latest"
          docker push "ghcr.io/${REPO_LOWER}/sas26-reproduction:latest"

      - name: Create source bundle, manifest and checksums
        run: |
          mv dist/proposition7-review-bundle.tar.gz dist/sas26_reproduction.source.tar.gz
          sed -i "s|image_name=.*|image_name=ghcr.io/${{ github.repository_owner }}/sas26-reproduction:${{ github.ref_name }}|" dist/proposition7-review-manifest.txt
          mv dist/proposition7-review-manifest.txt dist/sas26_reproduction.manifest.txt
          sha256sum dist/sas26_reproduction.source.tar.gz dist/sas26_reproduction.manifest.txt > dist/sas26_reproduction.checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Docker Image
            ```
            docker pull ghcr.io/${{ github.repository_owner }}/sas26-reproduction:${{ github.ref_name }}
            ```

            ## Source Bundle
            Contains the source code used to build the artifact.

            ## Running
            See README.md
          files: |
            dist/sas26_reproduction.source.tar.gz
            dist/sas26_reproduction.manifest.txt
            dist/sas26_reproduction.checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}