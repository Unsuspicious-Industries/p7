name: Docker Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    name: Build, push to GHCR, and create release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image names
        id: meta
        run: |
          REPO_LOWER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE_BASE="ghcr.io/${REPO_LOWER}/proposition7-benchmark-artifact"
          echo "tag=${IMAGE_BASE}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE_BASE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: artifact/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.latest }}
          build-args: |
            PROPOSITION7_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Create source bundle, manifest and checksums
        run: |
          set -euxo pipefail
          mkdir -p dist

          # Create source bundle (same exclusions as build_artifact_image.sh)
          tar -C .. \
            --exclude="$(basename "$PWD")/.git" \
            --exclude="$(basename "$PWD")/.github" \
            --exclude="$(basename "$PWD")/.env" \
            --exclude="$(basename "$PWD")/.env.*" \
            --exclude="$(basename "$PWD")/.mypy_cache" \
            --exclude="$(basename "$PWD")/.pytest_cache" \
            --exclude="$(basename "$PWD")/.ruff_cache" \
            --exclude="$(basename "$PWD")/**/*.egg-info" \
            --exclude="$(basename "$PWD")/.venv" \
            --exclude="$(basename "$PWD")/.vscode" \
            --exclude="$(basename "$PWD")/**/__pycache__" \
            --exclude="$(basename "$PWD")/**/*.pyc" \
            --exclude="$(basename "$PWD")/artifact-output" \
            --exclude="$(basename "$PWD")/benchmarks/out" \
            --exclude="$(basename "$PWD")/backup" \
            --exclude="$(basename "$PWD")/build" \
            --exclude="$(basename "$PWD")/checkpoints" \
            --exclude="$(basename "$PWD")/dist" \
            --exclude="$(basename "$PWD")/evals" \
            --exclude="$(basename "$PWD")/final" \
            --exclude="$(basename "$PWD")/hf-cache" \
            --exclude="$(basename "$PWD")/huggingface" \
            --exclude="$(basename "$PWD")/model-cache" \
            --exclude="$(basename "$PWD")/models" \
            --exclude="$(basename "$PWD")/processed" \
            --exclude="$(basename "$PWD")/result" \
            --exclude="$(basename "$PWD")/unified" \
            --exclude="$(basename "$PWD")/vast_model_matrix" \
            --exclude="$(basename "$PWD")/**/*.safetensors" \
            --exclude="$(basename "$PWD")/**/*.bin" \
            --exclude="$(basename "$PWD")/**/*.ckpt" \
            --exclude="$(basename "$PWD")/**/*.gguf" \
            --exclude="$(basename "$PWD")/**/*.onnx" \
            --exclude="$(basename "$PWD")/**/*.pt" \
            --exclude="$(basename "$PWD")/**/*.pth" \
            -czf dist/sas26_reproduction.source.tar.gz \
            "$(basename "$PWD")"

          # Write manifest
          {
            printf 'image_name=%s\n' "${{ steps.meta.outputs.tag }}"
            printf 'docker_image=%s\n' "${{ steps.meta.outputs.tag }}"
            printf 'source_bundle=dist/sas26_reproduction.source.tar.gz\n'
            printf 'dockerfile=artifact/Dockerfile\n'
            printf 'config_dir=benchmarks/configs\n'
            printf 'image_contains=source_tree,benchmark_configs,python_dependencies\n'
            printf 'image_excludes=api_keys,model_weights,model_caches,benchmark_outputs,backup\n'
            printf 'model_cache_mount=/cache/huggingface\n'
            printf 'output_mount=/workspace/benchmarks/out\n'
            for cfg in benchmarks/configs/*.toml; do
              printf 'config=%s sha256=%s\n' "$cfg" "$(sha256sum "$cfg" | cut -d ' ' -f 1)"
            done
            printf 'uv_lock_sha256=%s\n' "$(sha256sum uv.lock | cut -d ' ' -f 1)"
            printf 'dockerfile_sha256=%s\n' "$(sha256sum artifact/Dockerfile | cut -d ' ' -f 1)"
            printf 'git_commit=%s\n' "${{ github.sha }}"
            printf 'built_at_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/sas26_reproduction.manifest.txt

          sha256sum \
            dist/sas26_reproduction.source.tar.gz \
            dist/sas26_reproduction.manifest.txt \
            > dist/sas26_reproduction.checksums.txt

      - name: Generate release body
        run: |
          cat > dist/release_body.md <<'BODY'
          ## proposition7 — SAS 2026 Artifact

          Artifact for the SAS 2026 paper **"Semantic Prefix Analysis for Sound Constrained Code Generation with Large Language Models"**.

          This release contains the complete benchmark environment needed to reproduce all results reported in the paper.

          ---

          ### Included assets

          | File | Description |
          | --- | --- |
          | `sas26_reproduction.source.tar.gz` | Full source tree (excludes caches, model weights, `.env`) |
          | `sas26_reproduction.manifest.txt` | SHA256 checksums for configs, Dockerfile, and dependency lockfile |
          | `sas26_reproduction.checksums.txt` | Checksums for the release assets above |
          | _(GHCR only)_ | Docker image — too large for release assets; pull via `docker pull` below |

          ### Docker image

          Pull from GitHub Container Registry:

          ```bash
          docker pull ghcr.io/unsuspicious-industries/proposition7-benchmark-artifact:latest
          ```

          ---

          ### Quick start

          **1. Validate the benchmark plan (no model download, no GPU):**

          ```bash
          docker run --rm ghcr.io/unsuspicious-industries/proposition7-benchmark-artifact:latest \
            python benchmarks/run.py --config benchmarks/configs/sas26_reproduction.toml --dry-run
          ```

          Expected output:
          ```
          [matrix] fig3-core-local: backend=local models=7 modes=constrained_direct,constrained_mixed,unconstrained planned=5922 pending=5922
          [matrix] fig7-frontier-constrained: backend=local models=4 modes=constrained_mixed planned=1128 pending=1128
          [matrix] fig7-openrouter-raw: backend=openrouter models=3 modes=unconstrained planned=846 pending=846
          [matrix] text-reference-openrouter-raw: backend=openrouter models=1 modes=unconstrained planned=282 pending=282
          [plan] run=sas26-reproduction tasks=94 matrices=4 total_jobs=8178 pending_jobs=8178 run_dir=benchmarks/out/sas26-reproduction
          ```

          **2. Run a small GPU smoke test (one 4B model, all modes):**

          ```bash
          mkdir -p artifact-output hf-cache
          docker run --rm --gpus all \
            -v "$PWD/artifact-output:/workspace/benchmarks/out" \
            -v "$PWD/hf-cache:/cache/huggingface" \
            ghcr.io/unsuspicious-industries/proposition7-benchmark-artifact:latest \
            python benchmarks/run.py --config benchmarks/configs/mini-4b.toml --resume
          ```

          **3. Run the full SAS reproduction:**

          ```bash
          printf 'OPENROUTER_API_KEY=YOUR_KEY_HERE\n' > .env
          mkdir -p artifact-output hf-cache
          docker run --rm --gpus all \
            --env-file .env \
            -v "$PWD/artifact-output:/workspace/benchmarks/out" \
            -v "$PWD/hf-cache:/cache/huggingface" \
            ghcr.io/unsuspicious-industries/proposition7-benchmark-artifact:latest \
            python benchmarks/run.py --config benchmarks/configs/sas26_reproduction.toml --resume
          ```

          **4. Aggregate results into CSV summaries:**

          ```bash
          docker run --rm \
            -v "$PWD/artifact-output:/workspace/benchmarks/out" \
            ghcr.io/unsuspicious-industries/proposition7-benchmark-artifact:latest \
            python benchmarks/agg.py \
              --in benchmarks/out/sas26-reproduction/raw.jsonl \
              --out-dir benchmarks/out/sas26-reproduction/processed
          ```

          ---

          ### Benchmark configs

          | Config | Purpose | GPU | API key |
          | --- | --- | --- | --- |
          | `sas26_reproduction.toml` | Full paper reproduction | Yes | Yes (OpenRouter) |
          | `mini-4b.toml` | Single 4B model smoke test | Yes | No |
          | `small-models.toml` | Local small-model sweep (0.8B–4B) | Yes | No |
          | `simple.toml` | Broader local comparison (9B–27B) | Yes | No |

          ---

          ### Requirements

          - **Python**: `>=3.9, <3.13` (3.12 recommended)
          - **GPU**: CUDA host for local model rows; the full reproduction is intended for a GPU server
          - **RAM/VRAM**: roughly `2 × model_size` for unquantized runs
          - **OpenRouter API key**: required for configs with `backend = "openrouter"` rows

          ---

          ### What is included

          - Python package `proposition7` with type-aware constrained generation
          - Built-in typed grammars: `stlc`, `fun`, `imp`, `toy`
          - 94 benchmark tasks under `benchmarks/data/`
          - TOML benchmark configs under `benchmarks/configs/`
          - Docker artifact with all dependencies pre-installed
          - 65+ unit tests and generation smoke tests

          ### What is excluded

          - API keys, model weights, Hugging Face caches, benchmark outputs, or local backups

          ---

          See `README.md` in the source bundle for the full reviewer runbook with expected outputs, troubleshooting, and project layout.
          BODY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }} (SAS 2026 Artifact)
          body_path: dist/release_body.md
          files: |
            dist/sas26_reproduction.source.tar.gz
            dist/sas26_reproduction.manifest.txt
            dist/sas26_reproduction.checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
