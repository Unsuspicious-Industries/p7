name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-tests:
    name: Python unit tests (fast)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install aufbau bindings and proposition7
        run: |
          python -m pip install --upgrade pip
          git clone --depth 1 https://github.com/Unsuspicious-Industries/aufbau.git /tmp/aufbau
          python -m pip install /tmp/aufbau
          python -m pip install -e '.[dev]'

      - name: Run Python tests (unit)
        run: pytest -q

      - name: Upload Python test log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-pytest-log
          path: .pytest_cache || test-results || ''
