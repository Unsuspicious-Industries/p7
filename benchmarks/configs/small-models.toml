schema_version = 1

[run]
name = "small-models"
output_root = "benchmarks/out"
save_traces = false

[tasks]
selectors = ["all"]
ids = []
max_tasks = 0
max_tokens_override = 0

[execution]
seed = 7
timeout = 300.0
think_budget = 2048
model_concurrency = "auto"
low_space = false

tries = 1
temperature = 0.0

[local]
device = "cuda"
torch_dtype = "auto"
device_map = "auto"

[local.model_kwargs]

[openrouter]
env_file = ".env"

[[matrix]]
name = "minimum"
backend = "local"
models = [
  "Qwen/Qwen3.5-0.8B",
  "Qwen/Qwen3.5-2B",
  "EleutherAI/pythia-1.4b",
  "Qwen/Qwen3.5-2B-Base",
  "Qwen/Qwen3.5-4B",
  "Qwen/Qwen3.5-4B-Base",
]
modes = ["unconstrained", "constrained_direct", "constrained_mixed", "unconstrained_thinking"]
