schema_version = 1

[run]
name = "minimal_reproduciton_run"
output_root = "benchmarks/out"
save_traces = false

[tasks]
selectors = ["all"]
ids = []
max_tasks = 0
max_tokens_override = 0

[execution]
tries = 1
seed = 7
timeout = 300.0
think_budget = 2048
model_concurrency = "auto"
low_space = true

[local]
device = "cuda"
torch_dtype = "auto"
device_map = "auto"

[local.model_kwargs]

[openrouter]
env_file = ".env"


[[matrix]]
name = "fig7-frontier-constrained"
backend = "local"
models = [
  "Qwen/Qwen3.6-27B",
]
modes = ["constrained_mixed"]

[[matrix]]
name = "fig7-openrouter-raw"
backend = "openrouter"
models = [
  "openai/gpt-5.4-mini",
]
modes = ["unconstrained"]

[[matrix]]
name = "text-reference-openrouter-raw"
backend = "openrouter"
models = [
  # Section 6 notes GPT-5.3 reached 100% as a reference point.
  "openai/gpt-5.3-codex",
]
modes = ["unconstrained"]
