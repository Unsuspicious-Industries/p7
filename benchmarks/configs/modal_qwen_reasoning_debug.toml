schema_version = 1

[run]
name = "modal-qwen-reasoning-debug"
output_root = "benchmarks/out"
save_traces = false

[tasks]
selectors = ["all"]
ids = []
max_tasks = 1
max_tokens_override = 16

[execution]
tries = 1
seed = 7
timeout = 300.0
think_budget = 256
# Concurrent runs are only for one model at a time. Models and matrices stay sequential.
model_concurrency = "auto"
low_space = true

[local]
device = "cuda"
torch_dtype = "auto"
device_map = "auto"

[local.model_kwargs]

[[matrix]]
name = "qwen-reasoning-debug"
backend = "local"
models = ["Qwen/Qwen3.5-0.8B"]
modes = ["constrained_mixed", "unconstrained_thinking"]
