# Preferred unconstrained evaluator for closed models through OpenRouter.
#
# Run this at the same time as `benchmarks/configs/deploy_constrained.toml` on a
# GPU/Vast host. This job does not need `--gpus all` and only requires `.env`
# with OPENROUTER_API_KEY mounted into the container.
#
#   docker run --rm \
#     --env-file .env \
#     -v "$PWD/artifact-output:/workspace/benchmarks/out" \
#     proposition7-benchmark-artifact:latest \
#     python benchmarks/run.py --config benchmarks/configs/openrouter_closed.toml --resume
#
# Closed models cannot run constrained generation because OpenRouter does not
# expose token-level logits. Keep this config unconstrained-only.

schema_version = 1

[run]
name = "openrouter-closed"
output_root = "benchmarks/out"
save_traces = false

[tasks]
selectors = ["all"]
ids = []
max_tasks = 0
max_tokens_override = 0

[execution]
tries = 1
seed = 7
timeout = 300.0
think_budget = 2048
# Concurrent runs are only for one model at a time. Models and matrices stay sequential.
model_concurrency = "8"
low_space = false

[local]
device = "cpu"
torch_dtype = "none"
device_map = ""

[local.model_kwargs]

[openrouter]
env_file = ".env"

[[matrix]]
name = "closed-unconstrained"
backend = "openrouter"
models = [
  "openai/gpt-5.4-mini",
  "openai/gpt-5.3-codex",
  "anthropic/claude-4.5-haiku",
  "google/gemini-3.0-flash-latest",
  "qwen/qwen3.5-35b-a3b",
  "google/gemma-4-31b-it",
]
modes = ["unconstrained", "unconstrained_cleaned"]
