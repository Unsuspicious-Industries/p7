schema_version = 1

[run]
name = "minimal_reproduciton_run"
output_root = "benchmarks/out"
save_traces = false

[tasks]
selectors = ["all"]
ids = []
max_tasks = 0
max_tokens_override = 0

[execution]
tries = 1
seed = 7
timeout = 300.0
think_budget = 2048
model_concurrency = "auto"
low_space = true

[local]
device = "cuda"
torch_dtype = "auto"
device_map = "auto"

[local.model_kwargs]

[openrouter]
env_file = ".env"


[[matrix]]
name = "vsmall"
backend = "local"
models = [
  "gpt2",
]
modes = ["constrained"]
