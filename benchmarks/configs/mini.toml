# LMPL shakeout config: one capable 4B model over the full task corpus and
# every single-shot mode. Small enough to validate the whole pipeline on a
# fresh GPU box (model download, constrained decoding, agent episodes,
# oracles) before committing to the main run.
#
#   python benchmarks/run.py --config benchmarks/configs/mini.toml --resume

schema_version = 1

[run]
name = "lmpl-mini"
output_root = "benchmarks/out"
save_traces = false

[tasks]
selectors = ["all"]
ids = []
max_tasks = 0
max_tokens_override = 0

[execution]
tries = 1
seed = 7
timeout = 300.0
think_budget = 512
model_concurrency = "auto"
low_space = true
temperature = 0.0

[local]
device = "cuda"
torch_dtype = "auto"
device_map = "auto"

[local.model_kwargs]

[openrouter]
env_file = ".env"

[[matrix]]
name = "shakeout"
backend = "local"
models = [
  "Qwen/Qwen3.5-4B",
]
modes = [
  "unconstrained",
  "constrained_direct",
  "constrained_mixed",
  "unconstrained_thinking",
  "syntactic_only",
]
