schema_version = 1

[run]
name = "modal-qwen-full"
output_root = "benchmarks/out"
save_traces = false

[tasks]
selectors = ["all"]
ids = []
max_tasks = 0
max_tokens_override = 0

[execution]
tries = 1
seed = 7
timeout = 300.0
think_budget = 2048
# Concurrent runs are only for one model at a time. Models and matrices stay sequential.
model_concurrency = "auto"
low_space = true

[local]
device = "cuda"
torch_dtype = "auto"
device_map = "auto"

[local.model_kwargs]

[[matrix]]
name = "qwen-full"
backend = "local"
models = [
  "Qwen/Qwen3.5-0.8B",
  "Qwen/Qwen3.5-2B",
  "Qwen/Qwen3.5-4B",
  "Qwen/Qwen3.5-9B",
]
modes = [
  "constrained_direct",
  "constrained_mixed",
  "unconstrained_thinking",
  "unconstrained",
  "unconstrained_cleaned",
]
