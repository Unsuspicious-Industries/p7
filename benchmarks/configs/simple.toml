schema_version = 1

[run]
name = "outlines-compare"
output_root = "benchmarks/out"
save_traces = false

[tasks]
selectors = ["all"]
ids = []
max_tasks = 0
max_tokens_override = 0

[execution]
tries = 3
seed = 7
timeout = 300.0
think_budget = 2048
model_concurrency = "auto"
low_space = true

[local]
device = "cuda"
torch_dtype = "auto"
device_map = "auto"

[local.model_kwargs]

[openrouter]
env_file = ".env"

[[matrix]]
name = "simple-all"
backend = "local"
models = [
  "Qwen/Qwen3.5-9B",
  "Qwen/Qwen3.5-9B-Base",
  "google/gemma-4-26b-a4b-it",
  "Qwen/Qwen3.6-27B",
  "microsoft/Phi-4-mini-instruct",
]
modes = ["unconstrained", "constrained_direct", "constrained_mixed", "unconstrained_thinking", "outlines", "outlines_mixed"]
