schema_version = 1

[run]
name = "paper"
output_root = "benchmarks/out"
save_traces = false
gpu_ram_min = 24

[tasks]
selectors = ["all"]
ids = []
max_tasks = 0
max_tokens_override = 0

[execution]
tries = 1
seed = 7
timeout = 300.0
think_budget = 2048
# Concurrent runs are only for one model at a time. Models and matrices stay sequential.
model_concurrency = "auto"
low_space = true

[local]
device = "cuda"
torch_dtype = "auto"
device_map = "auto"

[local.model_kwargs]

[openrouter]
env_file = ".env"

# 31 unique models total across all matrices.

[[matrix]]
name = "local-complete"
backend = "local"
models = [
  "gpt2",
  "gpt2-medium",
  "EleutherAI/pythia-160m",
  "EleutherAI/pythia-410m",
  "EleutherAI/pythia-1.4b",
  "EleutherAI/pythia-2.8b",
  "EleutherAI/pythia-6.9b",
  "Qwen/Qwen3.5-0.5B",
  "Qwen/Qwen3.5-0.8B",
  "Qwen/Qwen3.5-2B",
  "Qwen/Qwen3.5-4B",
  "Qwen/Qwen3.5-4B-Base",
  "Qwen/Qwen3.5-9B",
  "Qwen/Qwen3.5-9B-Base",
  "microsoft/Phi-4-mini-instruct",
  "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B",
  "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B",
  "THUDM/glm-4-9b",
  "zai-org/GLM-Z1-9B-0414",
  "google/gemma-4-E4B-it",
  "google/gemma-4-26B-A4B-it",
  "openai/gpt-oss-20b",
  "moonshotai/Moonlight-16B-A3B",
  "THUDM/GLM-4.7-Flash",
  "Qwen/Qwen3.6-27B",
]
modes = [
  "constrained_direct",
  "constrained_mixed",
  "unconstrained",
  "unconstrained_thinking",
  "outlines", 
  "outlines_mixed"
]


[[matrix]]
name = "openrouter-baselines"
backend = "openrouter"
models = [
  "openai/gpt-5.4-mini",
  "openai/gpt-5.3-codex",
  "anthropic/claude-4.5-haiku",
  "google/gemini-3.0-flash-latest",
  "qwen/qwen3.5-35b-a3b",
  "google/gemma-4-31b-it",
]
modes = ["unconstrained", "unconstrained_thinking"]
