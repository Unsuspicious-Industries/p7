# Preferred Vast/OpenRouter evaluation split.
#
# This file records the intended full benchmark matrix:
#   - constrained modes run on deploy/Vast GPU-backed local models
#   - unconstrained modes run through OpenRouter closed models
#
# If you run this config directly, matrices execute sequentially. For the faster
# deployment workflow, launch the split configs at the same time instead:
#
#   docker run --rm --gpus all \
#     -v "$PWD/artifact-output:/workspace/benchmarks/out" \
#     proposition7-benchmark-artifact:latest deploy --resume
#
#   docker run --rm \
#     -v "$PWD/artifact-output:/workspace/benchmarks/out" \
#     -v "$PWD/.env:/workspace/.env:ro" \
#     proposition7-benchmark-artifact:latest openrouter --resume
#
# The split runs use different run.name values (`deploy-constrained` and
# `openrouter-closed`), so their raw JSONL files are independent and safe to
# write at the same time. Inside one runner process, concurrency stays limited
# to multiple runs of one model at a time.

schema_version = 1

[run]
name = "vast-preferred"
output_root = "benchmarks/out"
save_traces = false
gpu_ram_min = 20

[tasks]
selectors = ["all"]
ids = []
max_tasks = 0
max_tokens_override = 0

[execution]
tries = 1
seed = 7
timeout = 300.0
think_budget = 2048
# Concurrent runs are only for one model at a time. Models and matrices stay sequential.
model_concurrency = "auto"
low_space = true

[local]
device = "cuda"
torch_dtype = "auto"
device_map = "auto"

[local.model_kwargs]

[openrouter]
env_file = ".env"

[[matrix]]
name = "deploy-constrained"
backend = "local"
models = [
  "Qwen/Qwen3.5-0.8B",
  "Qwen/Qwen3.5-2B",
  "Qwen/Qwen3.5-4B",
  "Qwen/Qwen3.5-9B",
]
modes = [
  "constrained_direct",
  "constrained_mixed",
  "outlines",
  "outlines_mixed",
]

[[matrix]]
name = "closed-unconstrained"
backend = "openrouter"
models = [
  "openai/gpt-5.4-mini",
  "openai/gpt-5.3-codex",
  "anthropic/claude-4.5-haiku",
  "google/gemini-3.0-flash-latest",
  "qwen/qwen3.5-35b-a3b",
  "google/gemma-4-31b-it",
]
modes = ["unconstrained", "unconstrained_cleaned"]
