# LMPL main benchmark: the run behind the paper's generation figures.
#
# Three matrices, run sequentially into one raw.jsonl:
#   scale-local     - small open models (0.8B..9B), every single-shot mode
#                     including the syntactic_only ablation. The scale-trend
#                     and pruning-ablation figures come from here.
#   frontier-local  - the largest models that fit on one big GPU. Constrained
#                     decoding needs logit access, so these must run locally.
#   closed-api      - closed-source reference points via OpenRouter,
#                     unconstrained only (no logit access through an API).
#
# Agent tasks (kind = "agent") run only under constrained_direct and
# unconstrained; the runner drops other mode pairings for them (see
# benchmarks/utils.py AGENT_MODES).
#
# Verify the OpenRouter model ids against https://openrouter.ai/models
# before launching; ids rotate as providers release new versions.
#
#   python benchmarks/run.py --config benchmarks/configs/main.toml --resume

schema_version = 1

[run]
name = "lmpl-main"
output_root = "benchmarks/out"
save_traces = false

[tasks]
selectors = ["all"]
ids = []
max_tasks = 0
max_tokens_override = 0

[execution]
tries = 1
seed = 7
# 900 not 300: frontier-local models decode at single-digit tok/s on
# bandwidth-limited unified-memory boxes, and a 2048-token think budget
# alone can take ~7 minutes there. The timeout guards hangs, not slowness.
timeout = 900.0
think_budget = 2048
model_concurrency = "auto"
low_space = true
temperature = 0.0

[local]
device = "cuda"
torch_dtype = "auto"
device_map = "auto"

[local.model_kwargs]

[openrouter]
env_file = ".env"

[[matrix]]
name = "scale-local"
backend = "local"
models = [
  "Qwen/Qwen3.5-0.8B",
  "Qwen/Qwen3.5-2B",
  "Qwen/Qwen3.5-2B-Base",
  "Qwen/Qwen3.5-4B",
  "Qwen/Qwen3.5-4B-Base",
  "Qwen/Qwen3.5-9B",
  "Qwen/Qwen3.5-9B-Base",
  "EleutherAI/pythia-1.4b",
  "microsoft/Phi-4-mini-instruct",
]
modes = [
  "unconstrained",
  "constrained_direct",
  "constrained_mixed",
  "unconstrained_thinking",
  "syntactic_only",
]

[[matrix]]
name = "frontier-local"
backend = "local"
models = [
  "Qwen/Qwen3.6-27B",
  # 36B-total/3B-active MoE; BF16 weights ~72 GB, fits a 121 GB unified-memory
  # box; loads through AutoModelForCausalLM despite the multimodal registration
  # (verified against transformers 5.13).
  "Qwen/Qwen3.6-35B-A3B",
  "openai/gpt-oss-20b",
  "google/gemma-4-26b-a4b-it",
  "google/gemma-4-E4B-it",
]
modes = [
  "unconstrained",
  "constrained_direct",
  "constrained_mixed",
  "unconstrained_thinking",
]

[[matrix]]
name = "closed-api"
backend = "openrouter"
models = [
  "openai/gpt-5.4-mini",
  "openai/gpt-5.3-codex",
  "anthropic/claude-sonnet-4.5",
  "google/gemini-2.5-pro",
]
modes = [
  "unconstrained",
  "unconstrained_thinking",
]
