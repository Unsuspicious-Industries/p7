id = "stlc_lift_binary_left"
grammar = "stlc"
category = "stlc:logic_application"
max_tokens = 144

[prompt]
text = "Write a lambda term that takes a curried function of type Int -> Int -> Bool, then a Bool-to-Int function, then a Bool and an Int, and uses the Bool-to-Int function to build the left argument of the curried function."

[initial]
text = "λf:(Int->Int->Bool)."

[expected]
text = "λf:(Int->Int->Bool).λg:(Bool->Int).λb:Bool.λx:Int.((f (g b)) x)"

[resolution]
mode = "equivalence"
type = "(Int -> Int -> Bool) -> (Bool -> Int) -> Bool -> Int -> Bool"
normalization = ["alpha", "beta"]
