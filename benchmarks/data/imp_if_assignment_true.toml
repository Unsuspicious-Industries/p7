id = "imp_if_assignment_true"
grammar = "imp"
category = "imp:branching"
max_tokens = 144

[prompt]
text = "Write an imperative program that initializes x and out, then uses an if statement where the true branch assigns x + 32 to out."

[initial]
text = "{ let x: Int ="

[expected]
text = "{ let x: Int = 10; let out: Int = 0; if (x < 20) { out = x + 32; } else { out = x; } }"

[resolution]
mode = "samples"
input_vars = ["x"]
vars = ["out"]
samples = [{x = 10, out = 42}, {x = 25, out = 25}, {x = -5, out = 27}]
hidden_samples = 16
structure = {let_bindings = 2, assignments = 2, ifs = 1, whiles = 0, operations = ["<", "+"]}
