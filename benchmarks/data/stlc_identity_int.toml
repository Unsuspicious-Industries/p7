id = "stlc_identity_int"
grammar = "stlc"
category = "stlc:logic_identity"
max_tokens = 32

[prompt]
text = "Write a lambda term that takes an Int and returns it unchanged."

[initial]
text = "λx:Int."

[expected]
text = "λx:Int.x"

[resolution]
mode = "equivalence"
type = "Int -> Int"
normalization = ["alpha", "beta"]
