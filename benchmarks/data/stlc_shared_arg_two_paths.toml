id = "stlc_shared_arg_two_paths"
grammar = "stlc"
category = "stlc:logic_substitution"
max_tokens = 144

[prompt]
text = "Write a lambda term that takes a curried function of type Int -> Bool -> Int, then an Int transformer, then an Int-to-Bool function, then an Int, and feeds the same Int through both paths before combining the results with the curried function."

[initial]
text = "λf:(Int->Bool->Int)."

[expected]
text = "λf:(Int->Bool->Int).λg:(Int->Int).λh:(Int->Bool).λx:Int.((f (g x)) (h x))"

[resolution]
mode = "equivalence"
type = "(Int -> Bool -> Int) -> (Int -> Int) -> (Int -> Bool) -> Int -> Int"
normalization = ["alpha", "beta"]
