id = "stlc_return_function"
grammar = "stlc"
category = "stlc:logic_higher_order"
max_tokens = 64

[prompt]
text = "Write a lambda term that takes an Int-to-Int function and an Int, ignores the Int, and returns the original function."

[initial]
text = "λf:(Int->Int)."

[expected]
text = "λf:(Int->Int).λx:Int.f"

[resolution]
mode = "equivalence"
type = "(Int -> Int) -> Int -> Int -> Int"
normalization = ["alpha", "beta"]
