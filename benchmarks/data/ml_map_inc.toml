id = "ml_map_inc"
grammar = "ml"
category = "ml:recursion"
max_tokens = 176

[prompt]
text = "Define a recursive function adding 1 to each element of an int list, then map over 1, 2."

[initial]
text = "let rec inc : int list -> int list ="

[expected]
text = "let rec inc : int list -> int list = fun (xs : int list) -> match xs with [] -> [] | h :: t -> (h + 1) :: inc(t) in inc(1 :: 2 :: [])"

[resolution]
mode = "type"
type = "int list"
