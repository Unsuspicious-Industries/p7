id = "fun_int_area_rect"
grammar = "fun"
category = "fun:function_arithmetic"
max_tokens = 128

[prompt]
text = "Write a function that takes the width and height of a rectangle and returns the area, then return that function as the final expression."

[initial]
text = "let area: Int -> Int -> Int ="

[expected]
text = "let area: Int -> Int -> Int = (w: Int) => (h: Int) => w * h; area"

[resolution]
mode = "samples"
samples = [{w = 6, h = 7, v = 42}, {w = 3, h = 4, v = 12}, {w = 5, h = 5, v = 25}]
structure = {let_bindings = 1, applications = 0, lambdas = 2, operations = ["*"]}
fn = "area"
