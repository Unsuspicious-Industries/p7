id = "stlc_thrush_int_bool"
grammar = "stlc"
category = "stlc:logic_elimination"
max_tokens = 72

[prompt]
text = "Write a lambda term that takes an Int and then a continuation from Int to Bool, and passes the Int into that continuation."

[initial]
text = "λx:Int."

[expected]
text = "λx:Int.λf:(Int->Bool).(f x)"

[resolution]
mode = "equivalence"
type = "Int -> (Int -> Bool) -> Bool"
normalization = ["alpha", "beta"]
