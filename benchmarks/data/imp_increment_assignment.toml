id = "imp_increment_assignment"
grammar = "imp"
category = "imp:assignment"
max_tokens = 72

[prompt]
text = "Write an imperative program that initializes x to 41 and then increments x by assignment."

[initial]
text = "{ let x: Int ="

[expected]
text = "{ let x: Int = 41; x = x + 1; }"

[resolution]
mode = "env"
env = {x = 42}
vars = ["x"]
