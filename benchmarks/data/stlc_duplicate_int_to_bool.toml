id = "stlc_duplicate_int_to_bool"
grammar = "stlc"
category = "stlc:logic_contraction"
max_tokens = 96

[prompt]
text = "Write a lambda term that takes a curried function of type Int -> Int -> Bool and an Int, then applies that same Int as both arguments."

[initial]
text = "λf:(Int->Int->Bool)."

[expected]
text = "λf:(Int->Int->Bool).λx:Int.((f x) x)"

[resolution]
mode = "equivalence"
type = "(Int -> Int -> Bool) -> Int -> Bool"
normalization = ["alpha", "beta"]
