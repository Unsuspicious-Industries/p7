id = "stlc_compose_to_bool"
grammar = "stlc"
category = "stlc:logic_composition"
max_tokens = 80

[prompt]
text = "Write a lambda term that takes an Int-to-Bool function, then a Bool-to-Int function, then a Bool, and composes them so the Bool-to-Int function runs first."

[initial]
text = "λf:(Int->Bool)."

[expected]
text = "λf:(Int->Bool).λg:(Bool->Int).λb:Bool.(f (g b))"

[resolution]
mode = "equivalence"
type = "(Int -> Bool) -> (Bool -> Int) -> Bool -> Bool"
normalization = ["alpha", "beta"]
