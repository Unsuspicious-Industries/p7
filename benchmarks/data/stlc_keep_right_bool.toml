id = "stlc_keep_right_bool"
grammar = "stlc"
category = "stlc:logic_weakening"
max_tokens = 48

[prompt]
text = "Write a lambda term that takes an Int and then a Bool, and returns the Bool."

[initial]
text = "λx:Int."

[expected]
text = "λx:Int.λb:Bool.b"

[resolution]
mode = "equivalence"
type = "Int -> Bool -> Bool"
normalization = ["alpha", "beta"]
