id = "stlc_flip_int_bool_int"
grammar = "stlc"
category = "stlc:logic_argument_order"
max_tokens = 96

[prompt]
text = "Write a lambda term that takes a curried function of type Int -> Bool -> Int, then a Bool, then an Int, and applies the original function with the Int first and the Bool second."

[initial]
text = "λf:(Int->Bool->Int)."

[expected]
text = "λf:(Int->Bool->Int).λb:Bool.λx:Int.((f x) b)"

[resolution]
mode = "equivalence"
type = "(Int -> Bool -> Int) -> Bool -> Int -> Int"
normalization = ["alpha", "beta"]
