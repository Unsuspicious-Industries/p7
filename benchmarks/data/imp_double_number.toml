id = "imp_double_number"
grammar = "imp"
category = "imp:arithmetic"
max_tokens = 80

[prompt]
text = "Write an imperative program that initializes x and stores double its value in out."

[initial]
text = "{ let x: Int ="

[expected]
text = "{ let x: Int = 21; let out: Int = x + x; }"

[resolution]
