[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proposition7"
version = "0.1.0"
description = "Type-aware constrained decoding for LLMs using the Proposition 7 grammar format"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9,<3.13"
authors = [
    { name = "Paul Kronlund-Drouault" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]
keywords = ["llm", "constrained-decoding", "type-systems", "grammar", "code-generation"]
dependencies = ["aufbau-rs>=0.1.2", "grpcio>=1.65.0", "tomli>=2.0.0; python_version<'3.11'"]

[project.urls]
Homepage = "https://unsuspicious.org/blog/proposition-7"

[project.optional-dependencies]
transformers = ["transformers>=4.30.0", "torch>=2.0.0", "accelerate", "tiktoken"]
outlines = ["outlines[llguidance]>=1.2.0", "transformers>=4.30.0", "torch>=2.0.0", "accelerate"]
dev = ["pytest", "numpy", "flask>=2.3.0", "flask-cors>=4.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["proposition7", "proposition7.*"]

[tool.setuptools.package-data]
"proposition7.grammars" = ["*.auf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*.py"]
pythonpath = ["src", "."]
